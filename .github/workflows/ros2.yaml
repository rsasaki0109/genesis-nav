name: ros2

on:
  pull_request:
  push:
    branches: [main]

jobs:
  colcon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: Build ROS 2 packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths ros2_ws/src --packages-select genesis_nav_msgs genesis_nav_ros genesis_nav_bringup genesis_nav_examples
      - name: Test ROS 2 packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --base-paths ros2_ws/src --build-base build --install-base install --test-result-base log --packages-select genesis_nav_msgs genesis_nav_ros
          colcon test-result --test-result-base log --verbose
