name: genesis

on:
  pull_request:
  push:
    branches: [main]

jobs:
  genesis-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Try Genesis install
        run: python -m pip install genesis-world || true
      - name: Genesis integration tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/unit/test_genesis_integration.py tests/unit/test_genesis_urdf_adapter.py -v
