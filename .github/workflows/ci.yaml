name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/unit
      - name: Smoke scenario
        run: gnav run examples/scenarios/smoke.yaml --fast --output-dir /tmp/genesis-nav-runs
