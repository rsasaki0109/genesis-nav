scenario_id: bench_multi_agent_four_crossing
seed: 42
world: examples/worlds/warehouse_small.py
max_sim_seconds: 30
agents:
  - id: robot_001
    type: diff_drive
    spawn: [0.0, 0.0, 0.0]
  - id: robot_002
    type: diff_drive
    spawn: [4.0, 0.0, 3.14159]
  - id: robot_003
    type: diff_drive
    spawn: [2.0, -2.0, 1.5708]
  - id: robot_004
    type: diff_drive
    spawn: [2.0, 2.0, -1.5708]
tasks:
  - id: task_001
    type: navigate_to_pose
    agent: robot_001
    goal: [3.0, 0.0, 0.0]
  - id: task_002
    type: navigate_to_pose
    agent: robot_002
    goal: [1.0, 0.0, 3.14159]
  - id: task_003
    type: navigate_to_pose
    agent: robot_003
    goal: [2.0, 1.0, 1.5708]
  - id: task_004
    type: navigate_to_pose
    agent: robot_004
    goal: [2.0, -1.0, -1.5708]
metrics:
  - success_rate
  - collision_count
record:
  rosbag: false
  events: true
benchmark:
  expected:
    success_rate_min: 1.0
    task_succeeded_count_min: 4
    task_failed_count_max: 0
    command_rejection_count_max: 0
