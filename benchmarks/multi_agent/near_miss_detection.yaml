scenario_id: bench_multi_agent_near_miss
seed: 7
world: examples/worlds/warehouse_small.py
max_sim_seconds: 30
# Two agents on perpendicular paths cross near (1, 0). With detection enabled
# they register one near-miss and no collision. Guards the inter-agent proximity
# detector (NEAR_MISS / COLLISION events + counters). Detection is observation
# only — neither agent yields — so both still reach their goals (success_rate=1).
# Proximity *response* (yield / replan) is a documented follow-up.
runtime:
  collision:
    collision_radius_m: 0.3
    near_miss_radius_m: 1.0
agents:
  - id: a
    type: diff_drive
    namespace: /a
    spawn: [0.0, 0.0, 0.0]
    capabilities: [navigate_2d, stop, report_pose]
    authority: {mode: autonomous, command_ttl_ms: 200}
  - id: b
    type: diff_drive
    namespace: /b
    spawn: [1.0, -1.5, 1.5708]
    capabilities: [navigate_2d, stop, report_pose]
    authority: {mode: autonomous, command_ttl_ms: 200}
tasks:
  - {id: ta, type: navigate_to_pose, agent: a, goal: [2.0, 0.0, 0.0]}
  - {id: tb, type: navigate_to_pose, agent: b, goal: [1.0, 1.5, 1.5708]}
metrics: [success_rate]
record: {rosbag: false, events: true}
benchmark:
  expected:
    success_rate_min: 1.0
    task_succeeded_count_min: 2
    task_failed_count_max: 0
    near_miss_count_min: 1
    collision_count_max: 0
